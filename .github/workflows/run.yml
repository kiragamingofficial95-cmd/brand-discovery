name: brand-discovery
on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install optional dependencies
        run: pip install pymongo || true
      - name: Run brand discovery
        env:
          YOUTUBE_BACKEND: scraper
          YOUTUBE_BASE_URL: https://youtube-scraper-api-olive.vercel.app/youtube/v3
          WEB_SEARCH_API_KEY: ${{ secrets.WEB_SEARCH_API_KEY }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB: brand_discovery
        run: python -m brand_discovery run
      - name: Publish dashboard data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/latest.json reports/*.csv || true
          git commit -m "Update dashboard data [skip ci]" || echo "no changes"
          git push || echo "push failed"
      - uses: actions/upload-artifact@v4
        with:
          name: reports
          path: reports/
  # Dashboard is published by GitHub Pages (legacy build from master:/docs),
  # which rebuilds automatically on every push of docs/data/latest.json.

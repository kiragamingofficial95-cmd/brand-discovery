name: brand-discovery
on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run brand discovery
        env:
          YOUTUBE_BACKEND: scraper
          YOUTUBE_BASE_URL: https://youtube-scraper-api-olive.vercel.app/youtube/v3
          WEB_SEARCH_API_KEY: ${{ secrets.WEB_SEARCH_API_KEY }}
        run: python -m brand_discovery run
      - name: Publish dashboard data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git add docs/data/latest.json reports/*.csv || true
          git commit -m "Update dashboard data [skip ci]" || echo "no changes"
          git push || echo "push failed"
      - uses: actions/upload-artifact@v4
        with:
          name: reports
          path: reports/
